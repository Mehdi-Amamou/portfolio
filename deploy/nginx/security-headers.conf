# Inclus dans chaque location : un add_header local annule ceux du bloc parent.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Ne pas ajouter gyroscope ni accelerometer ici : la parallaxe du hero en a besoin sur téléphone.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# 'unsafe-inline' : Next injecte ses scripts inline sur des pages statiques, sans nonce possible.
# Les attributs style (Motion, positions) l'exigent aussi. Le site n'affiche aucun contenu tiers.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
